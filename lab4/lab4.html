        'use strict';

        // --- Блок тестов для класса Book ---
        describe("Класс Book", function () {
            let book;

            // Создаём новый объект перед каждым тестом
            beforeEach(function () {
                book = new Book("Title", 2020, 1000);
            });

            it("должен создать книгу с заголовком, годом публикации и ценой", function () {
                assert.strictEqual(book.title, "Title");
                assert.strictEqual(book.pubYear, 2020);
                assert.strictEqual(book.price, 1000);
            });

            it("метод show() должен вывести заголовок и цену книги", function () {
                let logOutput = "";
                const originalLog = console.log;
                console.log = function (msg) { logOutput = msg; };

                book.show();
                assert.strictEqual(logOutput, "Title: 1000");

                console.log = originalLog;
            });

            it("должен позволять изменить заголовок", function () {
                book.title = "New Title";
                assert.strictEqual(book.title, "New Title");
            });

            it("должен выбрасывать ошибку при установке пустого заголовка", function () {
                assert.throws(() => { book.title = ""; }, Error);
            });

            it("должен позволять изменить год публикации", function () {
                book.pubYear = 2021;
                assert.strictEqual(book.pubYear, 2021);
            });

            it("должен выбрасывать ошибку при установке отрицательного года", function () {
                assert.throws(() => { book.pubYear = -2021; }, Error);
            });

            it("должен позволять изменить цену", function () {
                book.price = 2000;
                assert.strictEqual(book.price, 2000);
            });

            it("должен выбрасывать ошибку при установке отрицательной цены", function () {
                assert.throws(() => { book.price = -2000; }, Error);
            });
        });

        // --- Блок тестов для статического метода Book.compare ---
        describe("Статический метод Book.compare", function () {
            let book1, book2, book3;

            beforeEach(function () {
                book1 = new Book("A", 2020, 1);
                book2 = new Book("B", 2019, 2);
                book3 = new Book("C", 2021, 3);
            });

            it("должен сортировать массив книг по году публикации", function () {
                let books = [book1, book2, book3];
                books.sort(Book.compare);
                assert.strictEqual(books[0].pubYear, 2019);
                assert.strictEqual(books[1].pubYear, 2020);
                assert.strictEqual(books[2].pubYear, 2021);
            });
        });

<!-- Начало блока тестов -->
describe("Функция isEmpty", function () {
    it("должна вернуть true для пустого объекта", function () {
        const emptyObj = {};
        assert.isTrue(isEmpty(emptyObj)); // Ожидается true
    });

    it("должна вернуть false для объекта с обычным свойством", function () {
        const objWithKey = { name: 'test' };
        assert.isFalse(isEmpty(objWithKey)); // Ожидается false
    });

    it("должна вернуть false для объекта с символом", function () {
        const sym = Symbol('my-symbol');
        const objWithSym = {[sym]: 'value'};
        
        // Проверяем, что обычный цикл for-in не видит символ
        let hasProps = false;
        for (let prop in objWithSym) {
            hasProps = true;
        }
        assert.isFalse(hasProps); // Обычная итерация ничего не нашла

        // Но наша функция должна учитывать символы
        assert.isFalse(isEmpty(objWithSym)); // Ожидается false
    });
});

        // --- Блок тестов для методов addClass / removeClass ---
        describe("Методы addClass и removeClass", function () {
            let obj;

            beforeEach(function () {
                obj = {
                    className: 'open menu',
                    addClass: function (cls) {
                        if (!this.className.split(' ').includes(cls)) {
                            this.className += ' ' + cls;
                        }
                        this.className = this.className.trim();
                        return this;
                    },
                    removeClass: function (cls) {
                        let classes = this.className.split(' ');
                        let index = classes.indexOf(cls);
                        if (index !== -1) {
                            classes.splice(index, 1);
                            this.className = classes.join(' ');
                        }
                        return this;
                    }
                };
            });

            it("addClass должен добавлять новый класс", function () {
                obj.addClass('newClass');
                assert.strictEqual(obj.className, 'open menu newClass');
            });

            it("addClass не должен добавлять дублирующийся класс", function () {
                obj.addClass('open');
                assert.strictEqual(obj.className, 'open menu');
            });

            it("removeClass должен удалять существующий класс", function () {
                obj.removeClass('open');
                assert.strictEqual(obj.className, 'menu');
            });

            it("removeClass не должен изменять строку, если класса нет", function () {
                obj.removeClass('newClass');
                assert.strictEqual(obj.className, 'open menu');
            });
        });

                 let json = JSON.stringify(obj);
                 let obj2 = JSON.parse(json);
                 assert.strictEqual(obj2.className, obj.className);
                 assert.isUndefined(obj2.addClass); 
             });
        });
