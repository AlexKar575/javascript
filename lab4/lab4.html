<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание по JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fde6fa; /* Нежно-розовый фон */
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }
        .console-output {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            white-space: pre-wrap; /* Сохраняет переносы строк */
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }
        h1 {
            color: #880e4f;
        }
    </style>
</head>
<body>

    <h1>Результаты выполнения задания</h1>

    <div id="output" class="console-output">
        <!-- Результаты появятся здесь -->
    </div>

    <script>
        // --- Класс Book ---
        class Book {
            constructor(title, pubYear, price) {
                this.title = title;
                this._pubYear = pubYear;
                this.#price = price;
            }

            #price;

            show() {
                console.log(`${this.title}: ${this.#price}`);
                this.logToPage(`${this.title}: ${this.#price}`);
            }

            get title() { return this._title; }
            set title(value) {
                if (value === '') throw new Error("Название не может быть пустым");
                this._title = value;
            }

            get pubYear() { return this._pubYear; }
            set pubYear(value) {
                if (typeof value !== 'number' || value <= 0) throw new Error("Год должен быть положительным числом");
                this._pubYear = value;
            }

            get price() { return this.#price; }
            set price(value) {
                if (typeof value !== 'number' || value <= 0) throw new Error("Цена должна быть положительным числом");
                this.#price = value;
            }

            static compare(a, b) {
                return a.pubYear - b.pubYear;
            }
        }

        // --- Вспомогательная функция для вывода на страницу ---
        function logToPage(message) {
            const outputDiv = document.getElementById('output');
            outputDiv.textContent += message + '\n';
        }


        // --- 1. Создание и использование класса Book ---
        logToPage("--- 1. Класс Book ---");
        const myBook = new Book("Война и мир", 1869, 1500);
        myBook.show();


        // --- 2. Проверка геттеров и сеттеров ---
        logToPage("\n--- 2. Проверка сеттеров ---");
        try {
            myBook.title = "Анна Каренина";
            logToPage(`Новое название: ${myBook.title}`);

            myBook.pubYear = 1877;
            logToPage(`Новый год публикации: ${myBook.pubYear}`);

            myBook.price = 2000;
            logToPage(`Новая цена: ${myBook.price}`);

            // Эта строка вызовет ошибку
            myBook.price = -500;
        } catch (e) {
             logToPage("Ошибка (ожидаемая): " + e.message);
        }


        // --- 3. Статический метод compare ---
        logToPage("\n--- 3. Сортировка книг ---");
        const bookA = new Book("Старый пёс", 1990, 100);
        const bookB = new Book("Молодой кот", 2020, 500);
        const bookC = new Book("Средняя птица", 2005, 300);

        const books = [bookA, bookB, bookC];
        books.sort(Book.compare);

        logToPage("Книги после сортировки по году:");
        books.forEach(b => logToPage(`- ${b.title} (${b.pubYear})`));


        // --- 4. Функция isEmpty ---
        logToPage("\n--- 4. Функция isEmpty ---");

        function isEmpty(obj) {
          for (let key in obj) return false;
          return true; // Если цикл не нашел перечисляемых свойств
        }

        logToPage(`isEmpty({}): ${isEmpty({})}`);
        
        const symObj = { [Symbol('sym')]: 'value' };
        logToPage(`isEmpty({[Symbol()]: true}): ${isEmpty(symObj)}`); 
        


        // --- 5. Методы addClass / removeClass ---
        logToPage("\n--- 5. Методы addClass / removeClass ---");
        let obj = {
          className: 'open menu',
          addClass(cls) {
              let classes = this.className.split(' ');
              if (!classes.includes(cls)) {
                  classes.push(cls);
                  this.className = classes.join(' ');
              }
              return this;
          },
          removeClass(cls) {
              let classes = this.className.split(' ');
              let index = classes.indexOf(cls);
              if (index !== -1) {
                  classes.splice(index, 1);
                  this.className = classes.join(' ');
              }
              return this;
          }
      };

      obj.addClass('new');
      logToPage(`После addClass('new'): '${obj.className}'`);
      obj.removeClass('open');
      logToPage(`После removeClass('open'): '${obj.className}'`);


      // --- 6. JSON ---
      logToPage("\n--- 6. JSON ---");
      let jsonString = JSON.stringify(obj, null, 2);
      logToPage("JSON-строка:");
      logToPage(jsonString);


      // --- 7. getSecondsToday ---
      logToPage("\n--- 7. getSecondsToday ---");
      function getSecondsToday() {
          const now = new Date();
          return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      }
      logToPage(`Секунд с начала дня: ${getSecondsToday()}`);


      // --- 8. formatDate ---
      logToPage("\n--- 8. formatDate (новая дата) ---");
      function formatDate(date) {
          const day = String(date.getDate()).padStart(2, '0');
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const year = String(date.getFullYear()).slice(-2);
          return `${day}.${month}.${year}`;
      }
      const newDate = new Date(2024, 7, 15); // Август - это 7-й месяц (отсчет с 0)
      logToPage(formatDate(newDate)); 
        </script>
</body>
</html>
