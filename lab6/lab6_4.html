<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактируемая таблица 6x7</title>
    <style>
        body {
            background-color: #fde6fa;
            font-family: Arial, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 2px solid brown;
        }

        th,
        td {
            border: 1px solid brown;
            padding: 15px;
            text-align: center;
            position: relative;
            vertical-align: top;
            cursor: pointer;
        }

        th {
            background-color: #dcedc8;
            font-weight: bold;
        }

        td.editing textarea {
            width: 95%;
            height: 100%;
            box-sizing: border-box;
            resize: none;
            outline: none;
            border-radius: 3px;
        }

        .edit-buttons {
            display: none;
            margin-top: 10px;
            text-align: right;
        }

        td.editing .edit-buttons {
            display: block;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        button.ok-button {
            color: green;
            margin-left: 10px;
        }

        button.cancel-button {
            color: darkred;
        }

        button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <table id="editable-table">
        <thead>
            <tr>
                <th>Колонка 1</th>
                <th>Колонка 2</th>
                <th>Колонка 3</th>
                <th>Колонка 4</th>
                <th>Колонка 5</th>
                <th>Колонка 6</th>
                <th>Колонка 7</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        'use strict';

        const TABLE_ID = 'editable-table';
        const STORAGE_KEY = 'editableTableData';

        // Получаем ссылку на tbody и таблицу
        const tbody = document.querySelector(`#${TABLE_ID} tbody`);

        // --- ФУНКЦИИ ДЛЯ РАБОТЫ С SESSIONSTORAGE ---

        /**
         * Сохраняет текущее состояние таблицы в sessionStorage.
         */
        function saveTableToStorage() {
             const rowsData = [];
             tbody.querySelectorAll('tr').forEach(row => {
                 const cellsData = Array.from(row.cells).map(cell => cell.innerHTML.trim());
                 rowsData.push(cellsData);
             });
             sessionStorage.setItem(STORAGE_KEY, JSON.stringify(rowsData));
         }

         /**
          * Загружает таблицу из sessionStorage, если там есть данные.
          */
         function loadTableFromStorage() {
             const savedData = sessionStorage.getItem(STORAGE_KEY);
             if (!savedData) return; // Если данных нет, ничего не делаем

             try {
                 const data = JSON.parse(savedData);
                 let rowsHtml = '';
                 data.forEach(rowData => {
                     const cellsHtml = rowData.map(cellData => `<td>${cellData}</td>`).join('');
                     rowsHtml += `<tr>${cellsHtml}</tr>`;
                 });
                 tbody.innerHTML = rowsHtml; // Заполняем tbody загруженными данными
             } catch (e) {
                 console.error("Ошибка при загрузке данных из sessionStorage:", e);
             }
         }


         // --- ОСНОВНАЯ ЛОГИКА ---

         document.addEventListener('DOMContentLoaded', function () {
             // Сначала пытаемся загрузить данные из хранилища
             loadTableFromStorage();

             // Если хранилище пустое (первый запуск), создаем новую таблицу 6x7
             if (tbody.innerHTML.trim() === '') {
                 for (let i = 0; i < 6; i++) { // Создаем 6 строк
                     let cellsHtml = '';
                     for (let j = 0; j < 7; j++) { // В каждой строке по 7 ячеек
                         cellsHtml += `<td>Ячейка ${i+1},${j+1}</td>`;
                     }
                     // Создаем элемент строки и добавляем его в tbody
                     const row = document.createElement('tr');
                     row.innerHTML = cellsHtml;
                     tbody.appendChild(row);
                 }
                 // Сохраняем начальное состояние в хранилище
                 saveTableToStorage();
             }

             // Устанавливаем обработчик клика на всю таблицу (делегирование событий)
             document.getElementById(TABLE_ID).addEventListener('click', function (event) {
                 // Находим ближайшую ячейку td, по которой был клик
                 let target = event.target.closest('td');
                 
                 // Проверяем, что клик был по ячейке и она не в режиме редактирования,
                 // а также что это не ячейка заголовка (th)
                 if (target && !target.classList.contains('editing') && target.tagName === 'TD') {
                     startEditing(target);
                     event.stopPropagation();
                 }
             });
         });


         // --- ФУНКЦИИ РЕДАКТИРОВАНИЯ ---

         function startEditing(td) {
             td.classList.add('editing');
             const originalHtml = td.innerHTML;
             td.setAttribute('data-original-html', originalHtml); // Используем data-атрибут

             td.innerHTML = `
                 <textarea>${escapeHtml(originalHtml)}</textarea>
                 
                 <div class="edit-buttons">
                     <button class="ok-button">OK</button>
                     <button class="cancel-button">ОТМЕНА</button>
                 </div>
             `;

             td.querySelector('textarea').focus();
             
             // Используем стрелочные функции для сохранения контекста `td`
             td.querySelector('.ok-button').addEventListener('click', () => finishEditing(td, true));
             td.querySelector('.cancel-button').addEventListener('click', () => finishEditing(td, false));
         }

         function finishEditing(td, isSave) {
             const newValue = td.querySelector('textarea').value;
             const originalHtml = td.getAttribute('data-original-html');
 
             td.innerHTML = isSave ? newValue : originalHtml;
             td.classList.remove('editing');
 
             if (isSave) {
                  saveTableToStorage();
              }
         }
 
         function escapeHtml(str) {
              return str.replace(/[&<>]/g, function(m) {
                  if (m === '&') return '&amp;';
                  if (m === '<') return '&lt;';
                  if (m === '>') return '&gt;';
                  return m;
              });
          }
     </script>
</body>
</html>
