<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактируемая таблица</title>
    <style>
        body {
            background-color: #fde6fa; 
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th,
        td {
            border: 1px solid brown; 
            padding: 15px;
            text-align: center;
            position: relative; /* Нужно для позиционирования кнопок */
            vertical-align: top; /* Выравнивает содержимое по верху */
        }

        th {
            background-color: #dcedc8;
            font-weight: bold;
        }

        td.editing .edit-buttons { /* Кнопки видны только при редактировании */
            display: block;
        }
        
        td textarea {
            width: 95%; /* Чуть меньше ширины ячейки */
            height: 100%;
            box-sizing: border-box;
            resize: none;
            outline: none;
            border-radius: 3px;
        }

        .edit-buttons {
            display: none; /* По умолчанию скрыты */
            margin-top: 10px;
            text-align: right;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        button.ok-button {
            color: green;
            margin-left: 10px;
        }

        button.cancel-button {
            color: darkred;
        }

        button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<table id="editable-table">
    <thead>
        <tr>
            <th>Колонка 1</th>
            <th>Колонка 2</th>
            <th>Колонка 3</th>
            <th>Колонка 4</th>
            <th>Колонка 5</th>
            <th>Колонка 6</th>
            <th>Колонка 7</th>
        </tr>
    </thead>
    <tbody>
        <!-- Строки будут загружены сюда скриптом -->
    </tbody>
</table>

<script>
     'use strict';
     
    const TABLE_ID = 'editable-table';
    const STORAGE_KEY = 'editableTableData'; // Ключ для localStorage
    let tbody = null;

    document.addEventListener('DOMContentLoaded', function () {
        tbody = document.querySelector(`#${TABLE_ID} tbody`);

        // 1. ЗАГРУЗКА ДАННЫХ ИЗ LOCALSTORAGE
        loadTableFromStorage();

        // 2. НАЧАЛО РЕДАКТИРОВАНИЯ
        document.getElementById(TABLE_ID).addEventListener('click', function (event) {
            if (document.querySelector('td.editing')) return; // Не даем открыть вторую ячейку

            let target = event.target.closest('td');
            if (target && !target.classList.contains('editing')) {
                startEditing(target);
            }
        });
    });

    function startEditing(td) {
        td.classList.add('editing');
        const originalHtml = td.innerHTML;
        td.setAttribute('original-html', originalHtml);

        td.innerHTML = `
            <textarea>${escapeHtml(originalHtml)}</textarea>
            <div class="edit-buttons">
                <button class="ok-button">OK</button>
                <button class="cancel-button">ОТМЕНА</button>
            </div>
        `;

        td.querySelector('textarea').focus();

        // Навешиваем обработчики на новые кнопки
        td.querySelector('.ok-button').addEventListener('click', function () {
            finishEditing(td, true);
        });

        td.querySelector('.cancel-button').addEventListener('click', function () {
            finishEditing(td, false);
        });
    }

    function finishEditing(td, isSave) {
        const newValue = td.querySelector('textarea').value;
        const originalHtml = td.getAttribute('original-html');

        td.innerHTML = isSave ? newValue : originalHtml;
        td.classList.remove('editing');

        // 3. СОХРАНЕНИЕ В LOCALSTORAGE ТОЛЬКО ПРИ УСПЕШНОМ РЕДАКТИРОВАНИИ
        if (isSave) {
            saveTableToStorage();
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // --- ФУНКЦИИ ДЛЯ РАБОТЫ С LOCALSTORAGE ---

    /**
     * Сохраняет текущее состояние таблицы в localStorage.
     */
    function saveTableToStorage() {
        const rowsData = [];
        tbody.querySelectorAll('tr').forEach(row => {
            const cellsData = Array.from(row.cells).map(cell => cell.innerHTML.trim());
            rowsData.push(cellsData);
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(rowsData));
    }

    /**
     * Загружает таблицу из localStorage, если там есть данные.
     */
    function loadTableFromStorage() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) return; // Если данных нет, ничего не делаем

        try {
            const data = JSON.parse(savedData);
            
            // Генерируем HTML-код для строк таблицы
            let rowsHtml = '';
            data.forEach(rowData => {
                const cellsHtml = rowData.map(cellData => `<td>${cellData}</td>`).join('');
                rowsHtml += `<tr>${cellsHtml}</tr>`;
            });

            // Вставляем сгенерированные строки в tbody
            tbody.innerHTML = rowsHtml;
        } catch (e) {
            console.error("Ошибка при загрузке данных из localStorage:", e);
        }
    }
});
</script>
</body>
</html>
